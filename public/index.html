<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Resmi Gampong Deah Glumpang Powered by © 2026 Serenity Creativa Labs.</title>
  <meta name="description" content="Serenity: sistem informasi gampong/desa — data warga, dusun, papan informasi, highlight Instagram, dan WhatsApp warga.">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Serenity">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Serenity">
  <meta name="author" content="Serenity Creativa Labs">
  <meta name="copyright" content="Deah Glumpang ◦ Powered by Serenity Creativa Labs. © 2026 All Rights Reserved">
  <script>
    // Terapkan mode gelap/terang sebelum halaman tampil (mencegah kedip putih)
    // Terapkan tema terakhir dari Super Admin (warna, huruf, model, efek) + mode gelap/terang sebelum halaman tampil
    (function () { try {
      var h = document.documentElement, t = JSON.parse(localStorage.getItem('dd:temaSnap') || 'null');
      if (t) {
        if (t.css) h.style.cssText = t.css;
        for (var k in t.ds) if (t.ds[k]) h.dataset[k] = t.ds[k];
        (t.links || []).forEach(function (u) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = u; document.head.appendChild(l); });
      }
      var p = t && t.toggle === false ? '' : localStorage.getItem('dd:theme'); var m = p || (t && t.mode) || 'auto';
      var d = m === 'auto' ? matchMedia('(prefers-color-scheme: dark)').matches : m === 'dark';
      h.dataset.theme = d ? 'dark' : 'light';
      // warna dasar tema langsung dipasang → tidak ada kilatan layar putih (desktop, ponsel, PWA)
      h.style.backgroundColor = t ? (d ? t.bgD : t.bgL) || '' : (d ? '#0d1117' : '');
      h.style.colorScheme = d ? 'dark' : 'light';
      var mc = t ? (d ? t.metaD : t.metaL) || t.meta : (d ? '#0f1419' : '');
      if (mc) document.querySelector('meta[name=theme-color]').setAttribute('content', mc);
    } catch (e) {} })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Ikon kustom dari Super Admin (disimpan di perangkat) agar langsung tampil di tab browser
    (function () { try { var ic = localStorage.getItem('dd:icon'); if (ic && /^(data:image\/|https:\/\/)/.test(ic)) document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function (l) { l.href = ic; l.removeAttribute('type'); }); } catch (e) {} })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Lora:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>html{background:#f5f6f8}@media (prefers-color-scheme:dark){html{background:#0d1117}}</style>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="splash"><div class="splash-logo"><span class="ring"></span><span class="ring r2"></span><div class="logo-mark big"><img src="icons/icon-192.png" alt=""></div></div><b class="splash-title">Serenity</b><div class="splash-bar"><span></span></div><small class="muted">Memuat portal data…</small></div>
  </div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script>
    // Petunjuk bila aplikasi tidak bisa dimuat (mis. dibuka dengan dobel-klik / file://)
    (function () {
      function help(reason) {
        var el = document.getElementById('app');
        if (!el || !el.querySelector('.splash')) return;
        el.innerHTML = '<div style="max-width:520px;margin:12vh auto;padding:28px;font-family:system-ui,sans-serif;line-height:1.6;background:#fff;color:#111;border:1px solid #e3e1d8;border-radius:16px;text-align:center">' +
          '<h2 style="margin-top:0;color:#0f766e">Website belum dapat dimuat</h2><p>' + reason + '</p>' +
          '<p><button onclick="location.reload()" style="padding:10px 18px;border:0;border-radius:10px;background:#0f766e;color:#fff;font-weight:600;cursor:pointer">Muat ulang</button></p>' +
          '<p style="color:#7a8481;font-size:13px">Deah Glumpang ◦ Powered by Serenity Creativa Labs. © 2026 All Rights Reserved</p></div>';
      }
      if (location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () { help('Halaman ini harus dibuka melalui alamat website, bukan dari berkas di komputer.'); });
      } else {
        setTimeout(function () { help('Koneksi internet lambat atau terputus. Periksa koneksi Anda, lalu muat ulang halaman.'); }, 15000);
      }
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
