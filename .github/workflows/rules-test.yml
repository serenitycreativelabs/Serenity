# Uji otomatis aturan keamanan database (Firestore Rules) memakai Firebase Emulator — tidak menyentuh data asli.
# Berjalan setiap kali firestore.rules berubah, atau manual dari tab Actions. Hasil: hijau = semua uji lolos.
name: Uji Aturan Keamanan

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - '.github/workflows/rules-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pasang alat uji
        run: npm install --no-save --no-audit --no-fund @firebase/rules-unit-testing@3 firebase@10
      - name: Jalankan uji di emulator
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-serenity "node --test tests/"
