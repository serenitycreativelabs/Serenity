# Deploy otomatis ke Firebase Hosting + Firestore Rules setiap push ke branch main
name: Deploy ke Firebase

on:
  push:
    branches: [main]
    # Mengubah dokumentasi saja (README, CHANGELOG, dll.) TIDAK memicu deploy
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/instagram-sync.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Siapkan kredensial
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum diisi (Settings → Secrets and variables → Actions)"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy Hosting & Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project digides-8423e --non-interactive

      - name: Hapus berkas kredensial sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      - name: Buat GitHub Release untuk versi baru
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if ! gh release view "v$VER" >/dev/null 2>&1; then
            gh release create "v$VER" --title "Serenity v$VER" --notes "Rilis otomatis. Lihat CHANGELOG.md. Powered by Serenity Creativa Labs. © 2026 All Rights Reserved" || true
          fi
