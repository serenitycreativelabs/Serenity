<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Serenity — Sistem Informasi Gampong Digital</title>
  <meta name="description" content="Serenity: sistem informasi gampong/desa — data warga, dusun, papan informasi, highlight Instagram, dan WhatsApp warga.">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Serenity">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Serenity">
  <meta name="author" content="Serenity Creativa Labs">
  <meta name="copyright" content="Deah Glumpang ◦ Powered by Serenity Creativa Labs. © 2026 All Rights Reserved">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Lora:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Terapkan mode gelap/terang sebelum halaman tampil (mencegah kedip putih)
    (function () { try { var p = localStorage.getItem('dd:theme'); var d = p ? p === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) {} })();
    // Ikon kustom dari Super Admin (disimpan di perangkat) agar langsung tampil di tab browser
    (function () { try { var ic = localStorage.getItem('dd:icon'); if (ic && /^(data:image\/|https:\/\/)/.test(ic)) document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function (l) { l.href = ic; l.removeAttribute('type'); }); } catch (e) {} })();
  </script>
</head>
<body>
  <div id="app">
    <div class="splash"><div class="splash-logo"><span class="ring"></span><span class="ring r2"></span><div class="logo-mark big"><img src="icons/icon-192.png" alt=""></div></div><b class="splash-title">Serenity</b><div class="splash-bar"><span></span></div><small class="muted">Memuat portal data…</small></div>
  </div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
  <script>
    // Petunjuk bila aplikasi tidak bisa dimuat (mis. dibuka dengan dobel-klik / file://)
    (function () {
      function help(reason) {
        var el = document.getElementById('app');
        if (!el || !el.querySelector('.splash')) return;
        el.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:28px;font-family:system-ui,sans-serif;line-height:1.6;background:#fff;border:1px solid #e3e1d8;border-radius:16px">' +
          '<h2 style="margin-top:0;color:#0f766e">Serenity belum bisa dimuat</h2><p>' + reason + '</p>' +
          '<p><b>Cara membuka yang benar:</b></p><ol>' +
          '<li>Setelah deploy: buka <a href="https://digides-8423e.web.app">https://digides-8423e.web.app</a> — login di <a href="https://digides-8423e.web.app/#/login">/#/login</a></li>' +
          '<li>Di komputer: buka terminal di folder <code>serenity</code>, jalankan <code>npx serve public</code>, lalu buka <code>http://localhost:3000</code></li></ol>' +
          '<p style="color:#7a8481;font-size:13px">Deah Glumpang ◦ Powered by Serenity Creativa Labs. © 2026 All Rights Reserved</p></div>';
      }
      if (location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function () { help('File dibuka langsung dari komputer (dobel-klik). Browser memblokir modul JavaScript dari <code>file://</code>, sehingga aplikasi harus dibuka lewat server web.'); });
      } else {
        setTimeout(function () { help('Aplikasi tidak merespons. Periksa koneksi internet (SDK Firebase dimuat dari internet), lalu muat ulang halaman.'); }, 15000);
      }
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
