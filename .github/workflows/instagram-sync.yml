# Sinkronisasi postingan Instagram ke Firestore setiap jam (tanpa perlu admin membuka aplikasi)
name: Sinkron Instagram

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sinkronkan
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: node scripts/sync-instagram.mjs
